services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ecoaction
      POSTGRES_USER: ecoaction
      POSTGRES_PASSWORD: ecoaction
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecoaction -d ecoaction']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ecoaction:ecoaction@db:5432/ecoaction
      PORT: '4000'
    ports:
      - '4000:4000'

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_started
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
      BACKEND_API_BASE_URL: http://backend:4000
    ports:
      - '3000:3000'

volumes:
  postgres_data:
